server:
  port: 8080

spring:
  application:
    name: autorizacion-pagos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pagos}
    username: ${SPRING_DATASOURCE_USERNAME:pagos}
    password: ${SPRING_DATASOURCE_PASSWORD:pagos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

bank:
  base-url: ${BANK_BASE_URL:http://localhost:8081}
  timeout-ms: 4000

resilience4j:
  circuitbreaker:
    instances:
      bancoExterno:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    instances:
      bancoExterno:
        timeoutDuration: 4s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
